[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-evaluation-harness"
version = "0.1.0"
description = "Offline LLM and RAG evaluation harness with heuristic metrics and CI quality gates."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Alexandru Cojocari" }]
keywords = ["llm", "evaluation", "rag", "qa", "pytest", "faithfulness"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

[project.scripts]
llm-eval = "llm_eval.cli:main"

[project.urls]
Homepage = "https://github.com/DatadrivenAlex/llm-evaluation-harness"
Repository = "https://github.com/DatadrivenAlex/llm-evaluation-harness"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_eval = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]

[tool.coverage.run]
branch = true
source = ["llm_eval"]

[tool.coverage.report]
show_missing = true
skip_empty = true
