name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Pytest
        run: python -m pytest
      - name: Offline evaluation gate
        run: python -m llm_eval run --dataset datasets/rag_faq.jsonl --out reports/
      - name: Failing golden case must miss the default gate
        run: |
          set +e
          python -m llm_eval run \
            --dataset datasets/golden_fail.jsonl \
            --out reports/golden-fail
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected datasets/golden_fail.jsonl to fail the quality gate"
            exit 1
          fi
          test -s reports/golden-fail/report.json
          test -s reports/golden-fail/report.md
          test -s reports/golden-fail/failures.json
          test -s reports/golden-fail/failures.md
